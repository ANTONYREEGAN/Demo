---
- name: Ubuntu Health Check
  hosts: ubuntu
  become: yes
  gather_facts: yes
 
  tasks:
 
    - name: Check CPU Load
      shell: "uptime | awk -F'load average:' '{ print $2 }'"
      register: cpu_load
 
    - name: Check Memory Usage
      shell: free -m
      register: memory_output
 
    - name: Check Disk Usage
      shell: df -h /
      register: disk_output
 
    - name: Check Uptime
      shell: uptime -p
      register: uptime_output
 
    - name: Check Failed Services
      shell: systemctl --failed
      register: failed_services
      ignore_errors: yes
 
    - name: Check if Reboot Required
      stat:
        path: /var/run/reboot-required
      register: reboot_required
 
    - name: Display Health Report
      debug:
        msg: |
          ===== UBUNTU HEALTH REPORT =====
          Host: {{ inventory_hostname }}
 
          CPU Load:
          {{ cpu_load.stdout }}
 
          Memory:
          {{ memory_output.stdout }}
 
          Disk:
          {{ disk_output.stdout }}
 
          Uptime:
          {{ uptime_output.stdout }}
 
          Failed Services:
          {{ failed_services.stdout }}
 
          Reboot Required:
          {{ reboot_required.stat.exists }}
